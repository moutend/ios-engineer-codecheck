name: iOS CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and all tests
    runs-on: macos-26
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Verify Xcode
        run: |
          xcodebuild -version
          xcodebuild -version | head -n 1 | grep -Fx 'Xcode 26.6'
      - name: Select simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = devices.get("com.apple.CoreSimulator.SimRuntime.iOS-26-5", [])
          device = next(d for d in candidates if d["name"] == "iPhone 17")
          print(device["udid"])
          ')
          echo "SIMULATOR_ID=$device_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
      - name: Build app and test bundles
        run: |
          mkdir -p artifacts
          xcodebuild build-for-testing \
            -project iOSEngineerCodeCheck.xcodeproj \
            -scheme iOSEngineerCodeCheck \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO
      - name: Run all unit and UI tests
        run: |
          xcodebuild test-without-building \
            -project iOSEngineerCodeCheck.xcodeproj \
            -scheme iOSEngineerCodeCheck \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath artifacts/Tests.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/Tests.xcresult
          if-no-files-found: ignore
          retention-days: 14

  required:
    name: iOS CI required
    if: always()
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Require successful build and all tests
        env:
          RESULT: ${{ needs.build-and-test.result }}
        run: test "$RESULT" = success
